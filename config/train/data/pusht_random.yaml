# Config for random-policy Push-T dataset (generated via gen_data_v3.py)
dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  name: pusht_random_train  # HDF5 file at $STABLEWM_HOME/pusht_random_train.h5
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state
